name: Testing CI

on:
  push:
    branches: [video]
  pull_request:
    branches: [video]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
        working-directory: testing
      - name: Run unit tests
        run: npm test
        working-directory: testing
      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: testing
      - name: Build
        run: npm run build
        working-directory: testing

